name: publish
on:
  push:
    # A daily Claude scheduled task commits trigger/publish.txt at ~21:43 and ~23:43 KST. Push events start
    # within seconds, unlike cron schedules, which GitHub started 8+ hours late on 11/17-18.
    paths: ["trigger/publish.txt"]
  schedule:
    # Posting window is 21:00-03:00 KST (publish.py enforces it). GitHub often starts scheduled runs late,
    # so several runs are spread over the window; each posts at most one overdue/due reel, the rest skip.
    - cron: "5 12 * * *"    # 21:05 KST
    - cron: "40 12 * * *"   # 21:40 KST
    - cron: "20 13 * * *"   # 22:20 KST
    - cron: "10 14 * * *"   # 23:10 KST
    - cron: "55 14 * * *"   # 23:55 KST
    - cron: "45 15 * * *"   # 00:45 KST
    - cron: "35 16 * * *"   # 01:35 KST
  workflow_dispatch:
    inputs:
      id:
        description: "post id from schedule.json (blank = whatever is due today)"
        required: false
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SCHED: ${{ github.event.schedule }}
          ID: ${{ inputs.id }}
        run: |
          if [ -n "$ID" ]; then python scripts/publish.py --id "$ID"; exit; fi
          python scripts/publish.py --type reel
      - name: Record published posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --cached --quiet || (git commit -m "Record published posts" && git pull --rebase && git push)
