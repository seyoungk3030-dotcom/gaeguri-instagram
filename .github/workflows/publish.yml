name: publish
on:
  schedule:
    - cron: "40 12 * * *"  # ~21:40 KST (GitHub often starts scheduled runs late), aims for 22:00 KST / 18:30 IST
    - cron: "20 13 * * *"  # backup run; already-published posts are skipped
    - cron: "40 7 * * *"   # card news ~16:40 KST (aims for 17:00 KST / 13:30 IST, Indian lunch break)
    - cron: "20 8 * * *"   # card news backup run
  workflow_dispatch:
    inputs:
      id:
        description: "post id from schedule.json (blank = whatever is due today)"
        required: false
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SCHED: ${{ github.event.schedule }}
          ID: ${{ inputs.id }}
        run: |
          if [ -n "$ID" ]; then python scripts/publish.py --id "$ID"; exit; fi
          case "$SCHED" in "40 7 * * *"|"20 8 * * *") T=card;; *) T=reel;; esac
          python scripts/publish.py --type "$T"
      - name: Record published posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --cached --quiet || (git commit -m "Record published posts" && git pull --rebase && git push)
