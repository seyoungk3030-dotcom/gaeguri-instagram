name: refresh-token
# Only needed for Instagram-login tokens (IGAA..., valid 60 days). Needs the GH_PAT secret; skipped without it.
on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh token and save it back as a secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          case "$IG_ACCESS_TOKEN" in IG*) ;; *) echo "not an Instagram-login token; nothing to refresh"; exit 0;; esac
          [ -n "$GH_TOKEN" ] || { echo "GH_PAT not set; skipping"; exit 0; }
          NEW=$(python scripts/refresh_token.py)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
