name: insights
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/insights.yml", "scripts/insights.py", "insights.request"]
  schedule:
    - cron: "0 3 * * *"  # 12:00 KST daily snapshot
permissions:
  contents: write
concurrency: publish
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/insights.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights.json
          git diff --cached --quiet || (git commit -m "Update insights" && git pull --rebase && git push)
